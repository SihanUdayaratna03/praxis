# Local mirror of the CI quality gate. Anything that fails here fails there.
# Install once with:  uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: \.md$
      - id: detect-private-key
      - id: no-commit-to-branch
        # Every phase merges into main through a reviewed PR. Nothing lands on
        # main by typing git commit.
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: no-secrets
        name: block credential-shaped strings
        entry: uv run python .claude/hooks/guard_no_secrets.py --staged
        language: system
        pass_filenames: false

      - id: conventional-commit
        name: conventional commit message
        entry: uv run python .claude/hooks/guard_commit_message.py
        language: system
        stages: [commit-msg]
