[project]
name = "praxis"
version = "0.1.0"
description = "Organizational memory and calibration engine: decisions that invalidate themselves, estimates that learn your bias."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sihan Udayaratna" }]
keywords = ["decision-provenance", "calibration", "multi-agent", "organizational-memory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # The dashboard's API and the server that binds its socket. ADR 0036. Four
  # packages reach the lock between them -- fastapi, starlette, uvicorn and
  # click -- and the response models are the pydantic already declared below.
  "fastapi>=0.141.1",
  # Resolves the platform data directory the store lives in. Promoted from a
  # transitive dev dependency to a declared runtime one by ADR 0010.
  "platformdirs>=4.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "typer>=0.12",
  "uvicorn>=0.52.4",
]

[project.urls]
Repository = "https://github.com/SihanUdayaratna03/praxis"

[project.scripts]
praxis = "praxis.cli:app"

[project.optional-dependencies]
live = [
    "anthropic>=0.116",
]

[dependency-groups]
dev = [
  "anthropic>=0.116",
  # Starlette 1.6 deprecates httpx for its TestClient and names this as
  # the replacement. filterwarnings = ["error"] turns that notice into a
  # failing suite, so the fix is the library rather than an ignore.
  "httpx2>=2.12",
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]

# ---------------------------------------------------------------------------
# Lint + format. Ruff replaces flake8/isort/black; one tool, one config.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["praxis", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # missing annotations -- the type discipline is enforced, not suggested
  "ARG",  # unused arguments
  "B",    # bugbear
  "C4",   # comprehensions
  "DTZ",  # naive datetimes: every Praxis timestamp must be tz-aware
  "E",    # pycodestyle errors
  "ERA",  # commented-out code
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # naming
  "PERF", # obvious performance traps
  "PL",   # pylint subset
  "PTH",  # pathlib over os.path
  "RET",  # return simplification
  "RUF",
  "S",    # bandit: security
  "SIM",
  "T20",  # no stray print(): logging is structured
  "TID",  # tidy imports
  "UP",   # pyupgrade
  "W",
]
ignore = [
  "ANN401", # Any is occasionally the honest annotation at provider boundaries
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic numbers, and take fixtures they do not read.
"tests/**" = ["ANN", "ARG", "PLR2004", "S101"]
# Hooks are standalone scripts invoked by Claude Code; stdout is their protocol.
".claude/hooks/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Types. Strict on the package; tests are checked but allowed to be untyped.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["praxis"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
  "slow: excluded from the fast feedback loop",
]

[tool.coverage.run]
source = ["praxis"]
branch = true
omit = ["praxis/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
