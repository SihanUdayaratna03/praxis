[project]
name = "praxis"
version = "0.1.0"
description = "Organizational memory and calibration engine: decisions that invalidate themselves, estimates that learn your bias."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sihan Udayaratna" }]
keywords = ["decision-provenance", "calibration", "multi-agent", "organizational-memory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/SihanUdayaratna03/praxis"

[project.scripts]
praxis = "praxis.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]
